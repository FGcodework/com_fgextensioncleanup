<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0f4a8a"/><stop offset="1" stop-color="#051c38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#4aa3ff" stop-opacity=".35"/><stop offset="1" stop-color="#4aa3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d9eaff"/><stop offset="1" stop-color="#8dbcf5"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a5a"/><stop offset=".6" stop-color="#ff5a36"/><stop offset="1" stop-color="#d93a1f"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a3"/><stop offset="1" stop-color="#f2a93b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000a1e" flood-opacity=".55"/>
    </filter>
    <mask id="cuts">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="132" cy="262" r="25" fill="#000"/>
      <circle cx="222" cy="352" r="25" fill="#000"/>
    </mask>
    <clipPath id="tile"><rect width="512" height="512" rx="95"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect x="3" y="3" width="506" height="506" rx="92" fill="none" stroke="#7fc0ff" stroke-opacity=".22" stroke-width="3"/>
  </g>

  <g transform="translate(-44 -22) scale(1.05)">
  <!-- puzzle piece = the extension -->
  <g filter="url(#shadow)">
    <g mask="url(#cuts)">
      <rect x="132" y="172" width="180" height="180" rx="26" fill="url(#piece)"/>
      <circle cx="222" cy="160" r="30" fill="url(#piece)"/>
      <circle cx="324" cy="262" r="30" fill="url(#piece)"/>
    </g>
    <path d="M150 186 q0-14 14-14 h46" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- dust -->
  <g fill="url(#orange)" filter="url(#shadow)">
    <rect x="68" y="372" width="30" height="30" rx="9" transform="rotate(-18 83 387)"/>
    <rect x="106" y="404" width="20" height="20" rx="6" transform="rotate(12 116 414)"/>
    <circle cx="150" cy="418" r="9"/>
  </g>

  <!-- broom -->
  <g transform="translate(372 318) rotate(32)" filter="url(#shadow)">
    <rect x="-9" y="-230" width="18" height="236" rx="9" fill="url(#orange)"/>
    <rect x="-9" y="-230" width="6" height="236" rx="3" fill="#fff" fill-opacity=".35"/>
    <path d="M-46 0 H46 L62 92 Q0 108 -62 92 Z" fill="url(#bristle)"/>
    <path d="M-30 8 V90 M-15 8 V96 M0 8 V98 M15 8 V96 M30 8 V90" stroke="#c97b17" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
    <rect x="-52" y="-18" width="104" height="30" rx="12" fill="url(#orange)"/>
    <rect x="-46" y="-14" width="92" height="8" rx="4" fill="#fff" fill-opacity=".38"/>
  </g>
  </g>
</svg>
