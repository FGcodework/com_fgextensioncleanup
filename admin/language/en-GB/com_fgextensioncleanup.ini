COM_FGEXTENSIONCLEANUP_SAFE_MODE="Safe mode:"
COM_FGEXTENSIONCLEANUP_SAFE_MODE_TEXT="The scan changes nothing. Automatic repair of folder is available only for a plugin with an unambiguously confirmed group. Removal of a database record is available only for a confirmed orphaned plugin, library or component (a library only when its manifest and files are missing, it is not part of a package and no other extension mentions it; a component only when it is not on disk at all and is not part of a package) and also removes its rows in #__schemas and #__update_sites_extensions. Joomla core extensions are grouped separately (never counted as orphaned) and are never offered for repair or removal. Modules, packages, templates, languages and file extensions are checked read-only."
